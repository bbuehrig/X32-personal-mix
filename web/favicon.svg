  <rect x="330" y="84" width="116" height="344" rx="16" fill="#1a1a1a"/>

  <!-- Track -->
  <rect x="372" y="108" width="28" height="296" rx="8" fill="#050505"/>
  <rect x="380" y="116" width="12" height="280" rx="4" fill="#333"/>

  <!-- Metal fader cap -->
  <rect x="348" y="220" width="76" height="100" rx="12" fill="url(#cap)"/>
  <rect x="360" y="254" width="52" height="7" rx="2" fill="#2e2e2e"/>
  <rect x="360" y="268" width="52" height="7" rx="2" fill="#2e2e2e"/>
  <rect x="360" y="282" width="52" height="7" rx="2" fill="#2e2e2e"/>

  <!-- LED meter -->
  <rect x="418" y="120" width="18" height="272" rx="4" fill="#0d0d0d"/>
