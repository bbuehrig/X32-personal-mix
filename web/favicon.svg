<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="X32 Personal Mix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f7"/>
      <stop offset="42%" stop-color="#c8ccd2"/>
      <stop offset="58%" stop-color="#8e939c"/>
      <stop offset="100%" stop-color="#dce0e6"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
